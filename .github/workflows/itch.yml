# Publishes the Godot game to itch.io on every push to main (what Tools/godot/release.sh does on the Windows PC); pushes
# to claude/** branches run the same build and tests without uploading:
# builds, exports for Windows, smoke-tests a Linux export of the same commit (the headless wave flow: dive in,
# enemies must come), then pushes the Windows build with butler. Players with the itch app update automatically.
#
# Needs the BUTLER_API_KEY repo secret (an itch.io API key: itch.io > Settings > API keys). Without it the build and
# the test still run and the upload is skipped. The page is Tools/godot/itch_target.txt ("user/game"), unless the
# ITCH_TARGET repo variable is set.
name: Publish to itch.io

on:
  push:
    branches: [main, "claude/**"]
    paths: ["godot/**", "Tools/godot/**", ".github/workflows/itch.yml"]
  workflow_dispatch:

concurrency:
  group: itch-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_DIR: Godot_v4.7.2-stable_mono_linux_x86_64
  GODOT_BIN: Godot_v4.7.2-stable_mono_linux.x86_64

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the screenshots branch
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/${GODOT_DIR}.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/${GODOT_DIR}/${GODOT_BIN}" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dir"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$dir/"

      - name: Build
        working-directory: godot
        run: |
          dotnet build RiskOfCopyright.csproj -nologo -v q
          "$GODOT" --headless --path . --import > ../import.log 2>&1 || true

      - name: Export
        working-directory: godot
        run: |
          mkdir -p ../build/windows ../build/linux
          "$GODOT" --headless --path . --export-release "Windows Desktop" ../build/windows/RiskOfCopyright.exe > ../export.log 2>&1 || true
          "$GODOT" --headless --path . --export-release "Linux" ../build/linux/RiskOfCopyright.x86_64 >> ../export.log 2>&1 || true
          if grep -qiE "^ERROR" ../export.log || [ ! -f ../build/windows/RiskOfCopyright.pck ] || [ ! -f ../build/linux/RiskOfCopyright.pck ]; then
            grep -iE "^ERROR" ../export.log | head -20; echo "export failed"; exit 1
          fi
          cp Tools/PLAYTEST_README.txt ../build/windows/README.txt
          printf '[[actions]]\nname = "play"\npath = "RiskOfCopyright.exe"\n' > ../build/windows/.itch.toml

      - name: Tests (the dive and first waves, the teleporters, Atlantis, Poseidon, mermaids)
        run: |
          chmod +x build/linux/RiskOfCopyright.x86_64
          failed=0
          for flags in "--waves --waveflow" "--teleport" "--atlantis" "--poseidon" "--mermaids" "--missiles" "--pickups" "--crab" "--mc51" "--terrain" "--shark" "--stations" "--pad" "--padmenus" "--slam" "--bite" "--sea" "--bulbs" "--clarity" "--gibs" "--classes" "--tridentbot" "--davey" "--jelly" "--angler" "--skills" "--hookbot" "--coralbot" "--magnetbot" "--plungerbot" "--pinballbot" "--moveposes"; do
            name=$(echo "$flags" | tr -d '-' | tr ' ' '_')
            log="$PWD/build/test_$name.log"
            timeout 300 build/linux/RiskOfCopyright.x86_64 --headless --log-file "$log" -- --autotest $flags > "$log.out" 2>&1 || true
            # A crash or a failed check gets one more try, after showing what went wrong, so a flaky test or an
            # intermittent engine crash doesn't block a release. A real bug fails both times.
            if ! grep -q "\[autotest\] done" "$log" || grep -qE "ERROR|\[autotest\] FAIL" "$log"; then
              echo "::warning::test $flags failed or crashed once; what went wrong, then one more try:"
              grep -E "ERROR|FAIL" "$log" | head -10; tail -15 "$log"; tail -15 "$log.out"
              timeout 300 build/linux/RiskOfCopyright.x86_64 --headless --log-file "$log" -- --autotest $flags > "$log.out" 2>&1 || true
            fi
            if ! grep -q "\[autotest\] done" "$log" || grep -qE "ERROR|\[autotest\] FAIL" "$log"; then
              echo "::error::test $flags failed"; grep -E "ERROR|FAIL" "$log" | head -20; failed=1
              echo "--- last lines of the log and the console:"; tail -25 "$log"; tail -40 "$log.out"
            else
              echo "test $flags passed"
            fi
            grep "\[autotest\]" "$log" | grep -vE "FAIL" | tail -12 || true
          done
          exit $failed

      - name: Online co-op test (a host and a joiner on this machine)
        run: |
          host="$PWD/build/test_net_host.log"; join="$PWD/build/test_net_join.log"
          for attempt in 1 2; do
            timeout 300 build/linux/RiskOfCopyright.x86_64 --headless --log-file "$host" -- --autotest --nettest --host > "$host.out" 2>&1 &
            sleep 8
            timeout 290 build/linux/RiskOfCopyright.x86_64 --headless --log-file "$join" -- --autotest --nettest --join 127.0.0.1 --class vacbot > "$join.out" 2>&1 || true
            wait || true
            if grep -q "net: PASS" "$host" && grep -q "net: PASS" "$join"; then echo "online test passed"; grep "net:" "$host" "$join"; exit 0; fi
            echo "::warning::online test attempt $attempt failed"; grep -E "net:|FAIL|ERROR" "$host" "$join" | head -30
          done
          echo "::error::online test failed"; exit 1

      # Only main goes to players; a work branch is built and tested (and gets its screenshots) but not uploaded.
      - name: Push to itch.io
        if: github.ref == 'refs/heads/main'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::warning::No BUTLER_API_KEY secret: built and tested, not uploaded."; exit 0; fi
          target="${ITCH_TARGET:-$(tr -d ' \r\n' < Tools/godot/itch_target.txt)}"
          version="$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          # butler's download host (itch has used both names): the first one that answers.
          for host in broth.itch.zone broth.itch.ovh; do
            curl -fsSL --retry 3 -o butler.zip "https://$host/butler/linux-amd64/LATEST/archive/default" && break
          done
          [ -s butler.zip ] || { echo "could not download butler"; exit 1; }
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/windows "$target:windows" --userversion "$version"
          ./butler/butler status "$target:windows"

      # Pictures of the newest boss and of Atlantis, rendered on a virtual screen (the tests above run without one), pushed to the
      # ci-screenshots branch so they can be looked at. Never blocks the release.
      - name: Screenshots
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p build/shots
          for test in poseidon atlantis mermaids missiles pickups crab mc51 tridentbot davey jelly angler; do
            timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" build/linux/RiskOfCopyright.x86_64 --rendering-method gl_compatibility \
              --log-file "$PWD/build/shots_$test.log" -- --autotest --$test --shots "$PWD/build/shots" > /dev/null 2>&1 || true
            # A run that crashed before its pictures gets one more go.
            if ! grep -q "\[autotest\] done" "build/shots_$test.log"; then
              timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" build/linux/RiskOfCopyright.x86_64 --rendering-method gl_compatibility \
                --log-file "$PWD/build/shots_$test.log" -- --autotest --$test --shots "$PWD/build/shots" > /dev/null 2>&1 || true
            fi
            grep "\[autotest\] shot" "build/shots_$test.log" || { echo "no pictures from $test:"; tail -8 "build/shots_$test.log"; }
          done
          ls build/shots

      - name: Push screenshots
        if: always()
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd build/shots
          [ -n "$(ls -A)" ] || { echo "no screenshots"; exit 0; }
          git init -q && git checkout -q -b ci-screenshots
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
